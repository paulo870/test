<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Poliglota | Sign In</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="login-logo">
                <img
                    src="images/logo.png"
                    alt="Poliglota"
                >
            </div>

            <h1>Welcome Back</h1>

            <p class="login-description">
                Sign in to access your Poliglota learning platform.
            </p>

            <form id="teacher-login-form">

                <div class="form-group">
                    <label for="teacher-username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="teacher-username"
                        name="username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="teacher-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="teacher-password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p
                    id="password-error"
                    class="login-error"
                    role="alert"
                    aria-live="polite"
                    style="display: none;"
                ></p>

                <button
                    type="submit"
                    id="login-submit-btn"
                >
                    Sign In
                </button>

            </form>

            <footer class="login-footer">
                Academia Poliglota
            </footer>

        </section>

    </main>

    <!-- Supabase library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Existing shared configuration -->
    <script src="js/supabase.js"></script>

    <!-- Sign-in functionality -->
    <script src="js/auth.js"></script>

</body>
</html>
