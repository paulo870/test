<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#102d3a">
    <title>Interactive Activity | Academia Poliglota</title>
    <link rel="stylesheet" href="css/interactive.css">
</head>
<body>
    <main class="activity-shell">
        <header class="activity-header">
            <div>
                <span class="activity-eyebrow">ACADEMIA POLIGLOTA</span>
                <h1 id="activity-title">Interactive Activity</h1>
                <p id="activity-instructions"></p>
            </div>
            <div class="activity-progress" id="activity-progress"></div>
        </header>

        <section id="activity-container" aria-live="polite">
            <div class="activity-loading">Loading activity...</div>
        </section>

        <footer class="activity-footer">
            <div id="activity-feedback" role="status"></div>
            <div class="activity-actions">
                <button id="check-answers" type="button">Check answers</button>
                <button id="reset-activity" type="button" class="secondary">
                    Try again
                </button>
            </div>
        </footer>
    </main>

    <script src="js/interactive.js"></script>
</body>
</html>
