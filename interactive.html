<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Activity</title>
    <link rel="stylesheet" href="css/interactive.css">
</head>
<body>

    <main class="interactive-app">

        <header class="activity-header">
            <span class="activity-label">INTERACTIVE ACTIVITY</span>
            <h1 id="activity-title">Activity</h1>
            <p id="activity-instructions"></p>
        </header>

        <section id="activity-area" aria-live="polite">
            <p class="activity-loading">Loading activity...</p>
        </section>

        <div class="activity-actions">
            <button id="check-answers" type="button">
                Check Answers
            </button>

            <button id="reset-activity" type="button">
                Try Again
            </button>
        </div>

        <section id="activity-results"
                 class="activity-results"
                 aria-live="polite">
        </section>

    </main>

    <script src="js/interactive.js"></script>

</body>
</html>
